name: EVEZ full-run integrity

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  economic-core:
    name: Economic + Reality core gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Install package metadata without lock enforcement
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Typecheck economic core
        run: |
          npx --yes tsc             --noEmit             --skipLibCheck             --target ES2022             --module ESNext             --moduleResolution bundler             --strict             lib/economic/types.ts             lib/economic/ledger.ts             lib/economic/drift-types.ts             lib/economic/drift-guard.ts             lib/economic/reality-receipt-types.ts             lib/economic/reality-receipt.ts
      - name: Validate JSON schemas
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for path in [
              Path("schema/economic-entry.schema.json"),
              Path("schema/reality-drift-check.schema.json"),
              Path("schema/reality-gate-receipt.schema.json"),
          ]:
              json.loads(path.read_text(encoding="utf-8"))
              print("VALID", path)
          PY

  integration-build:
    name: Next integration build (informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Install
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Typecheck application
        run: npm run typecheck
      - name: Build application
        run: npm run build
