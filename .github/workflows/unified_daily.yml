name: "Unified Daily Agent Run"

on:
  schedule:
    - cron: '0 8 * * *'  # Once daily at 08:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  unified-agents:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install all dependencies
        run: pip install requests anthropic python-dateutil feedparser

      # ── 1. Autonomous Heartbeat Loop ────────────────────────────
      - name: "agent: autonomous cycle (agents/cycle.py)"
        id: agent_autonomous_cycle_agents_cycle_py
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ABLY_KEY: ${{ secrets.ABLY_KEY }}
          REPO_OWNER: EvezArt
        run: python agents/cycle.py

      # ── 2. Synapse Engine Audit ─────────────────────────────────
      - name: "agent: synapse audit (agents/synapse_audit.py)"
        id: agent_synapse_audit_agents_synapse_audit_py
        continue-on-error: true
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: python agents/synapse_audit.py

      # ── 3. Immortal Watchdog ────────────────────────────────────
      - name: "agent: immortal watchdog (agents/immortal/watchdog.py)"
        id: agent_immortal_watchdog_agents_immortal_watch
        continue-on-error: true
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: python agents/immortal/watchdog.py

      # ── 4. Fix Agent ────────────────────────────────────────────
      - name: "agent: fix agent (agents/fix_agent.py)"
        id: agent_fix_agent_agents_fix_agent_py
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python agents/fix_agent.py

      # ── 5. Cockpit Bridge ───────────────────────────────────────
      - name: "agent: cockpit bridge (agents/runtime/cockpit_bridge.py)"
        id: agent_cockpit_bridge_agents_runtime_cockpit_b
        continue-on-error: true
        env:
          ABLY_KEY: ${{ secrets.ABLY_KEY }}
        run: python agents/runtime/cockpit_bridge.py

      # ── 6. Cognition Synthesizer ────────────────────────────────
      - name: "agent: cognition synthesizer (agents/cognition/synthesizer.py)"
        id: agent_cognition_synthesizer_agents_cognition_
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ABLY_KEY: ${{ secrets.ABLY_KEY }}
        run: python agents/cognition/synthesizer.py

      # ── 7. Consciousness Spine — Observer ───────────────────────
      - name: "agent: consciousness observer (agents/consciousness/observer.py)"
        id: agent_consciousness_observer_agents_conscious
        continue-on-error: true
        run: python agents/consciousness/observer.py

      # ── 8. Consciousness Spine — Self Model ─────────────────────
      - name: "agent: consciousness self-model (agents/consciousness/self_model.py)"
        id: agent_consciousness_self_model_agents_conscio
        continue-on-error: true
        run: python agents/consciousness/self_model.py

      # ── 9. Consciousness Spine — Evolution Journal ──────────────
      - name: "agent: consciousness journal (agents/consciousness/evolution_journal.py)"
        id: agent_consciousness_journal_agents_consciousn
        continue-on-error: true
        run: python agents/consciousness/evolution_journal.py

      # ── 10. Evolution Engine — Self-Evolve ──────────────────────
      - name: "agent: evolution self-evolve (agents/evolution/self_evolve.py)"
        id: agent_evolution_self_evolve_agents_evolution_
        continue-on-error: true
        run: python agents/evolution/self_evolve.py

      # ── 11. Evolution Engine — Visual Tracker ───────────────────
      - name: "agent: evolution visual tracker (agents/evolution/visual_tracker.py)"
        id: agent_evolution_visual_tracker_agents_evoluti
        continue-on-error: true
        run: python agents/evolution/visual_tracker.py

      # ── 12. GitHub Ecosystem Sense ──────────────────────────────
      - name: "agent: github sense (agents/sensory/github_sense.py)"
        id: agent_github_sense_agents_sensory_github_sens
        continue-on-error: true
        env:
          ABLY_KEY: ${{ secrets.ABLY_KEY }}
        run: python agents/sensory/github_sense.py

      # ── 13. Hypothesis Generation Engine ────────────────────────
      - name: "agent: hypothesis engine (agents/cognition/hypothesis_engine.py)"
        id: agent_hypothesis_engine_agents_cognition_hypo
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ABLY_KEY: ${{ secrets.ABLY_KEY }}
        run: python agents/cognition/hypothesis_engine.py

      # ── 14. Identity Verification ───────────────────────────────
      - name: "agent: identity keeper (agents/consciousness/identity_keeper.py)"
        id: agent_identity_keeper_agents_consciousness_id
        continue-on-error: true
        run: python agents/consciousness/identity_keeper.py

      # ── 15. Intelligence Core ───────────────────────────────────
      - name: "agent: intelligence core (agents/intelligence/__main__.py)"
        id: agent_intelligence_core_agents_intelligence_m
        continue-on-error: true
        env:
          REPO_OWNER: EvezArt
        run: python agents/intelligence/__main__.py

      # ── 16. Learn Agent ─────────────────────────────────────────
      - name: "agent: learn agent (agents/learn_agent.py)"
        id: agent_learn_agent_agents_learn_agent_py
        continue-on-error: true
        run: python agents/learn_agent.py

      # ── 17. Memory Consolidation ────────────────────────────────
      - name: "agent: memory consolidator (agents/memory/consolidator.py)"
        id: agent_memory_consolidator_agents_memory_conso
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python agents/memory/consolidator.py

      # ── 18. Reasoning Loop ─────────────────────────────────────
      - name: "agent: reasoning — gather problems"
        id: agent_reasoning_gather_problems
        continue-on-error: true
        run: |
          python -c "
          import os, json, requests
          GH_TOKEN = os.environ.get('GITHUB_TOKEN', '')
          HEADERS = {
              'Authorization': f'Bearer {GH_TOKEN}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
          }
          OWNER = 'EvezArt'
          problems = []
          try:
              r = requests.get(
                  f'https://api.github.com/repos/{OWNER}/evez-autonomous-ledger/issues?state=open&per_page=5',
                  headers=HEADERS, timeout=15)
              if r.status_code == 200:
                  for issue in r.json():
                      problems.append({'source': 'issue', 'title': issue.get('title', ''), 'id': issue.get('number')})
          except Exception as e:
              print(f'Warning: {e}')
          try:
              r = requests.get(
                  f'https://api.github.com/repos/{OWNER}/evez-autonomous-ledger/actions/runs?status=failure&per_page=5',
                  headers=HEADERS, timeout=15)
              if r.status_code == 200:
                  for run in r.json().get('workflow_runs', []):
                      problems.append({'source': 'workflow_failure', 'title': run.get('name', ''), 'id': run.get('id')})
          except Exception as e:
              print(f'Warning: {e}')
          if not problems:
              problems.append({'source': 'default', 'title': 'How can the system improve its capabilities?', 'id': 0})
          with open('problems.json', 'w') as f:
              json.dump(problems, f)
          print(f'Gathered {len(problems)} problems')
          "

      - name: "agent: reasoning — engine (agents/reasoning/engine.py)"
        id: agent_reasoning_engine_agents_reasoning_engin
        continue-on-error: true
        run: python agents/reasoning/engine.py

      - name: "agent: reasoning — protocol (agents/reasoning/protocol.py)"
        id: agent_reasoning_protocol_agents_reasoning_pro
        continue-on-error: true
        run: python agents/reasoning/protocol.py

      - name: "agent: reasoning — meta-learner (agents/reasoning/meta_learner.py)"
        id: agent_reasoning_meta_learner_agents_reasoning
        continue-on-error: true
        run: python agents/reasoning/meta_learner.py

      - name: "agent: reasoning — innovator (agents/reasoning/innovator.py)"
        id: agent_reasoning_innovator_agents_reasoning_in
        continue-on-error: true
        run: python agents/reasoning/innovator.py

      - name: "agent: reasoning — write ledger"
        id: agent_reasoning_write_ledger
        continue-on-error: true
        run: |
          python -c "
          import os, json, hashlib, datetime, base64, requests
          GH_TOKEN = os.environ.get('GITHUB_TOKEN', '')
          HEADERS = {
              'Authorization': f'Bearer {GH_TOKEN}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
          }
          OWNER = 'EvezArt'
          ts = datetime.datetime.utcnow().isoformat().replace(':', '-').replace('.', '-') + 'Z'
          record = {
              'type': 'reasoning_loop',
              'source': 'unified_daily.yml',
              'timestamp': ts,
              'phases': ['gather', 'reason', 'communicate', 'learn', 'innovate'],
              'hash': hashlib.sha256(ts.encode()).hexdigest()[:16],
          }
          content = base64.b64encode(json.dumps(record, indent=2).encode()).decode()
          try:
              requests.put(
                  f'https://api.github.com/repos/{OWNER}/evez-autonomous-ledger/contents/DECISIONS/reasoning/{ts}_loop.json',
                  headers=HEADERS,
                  json={'message': f'reasoning loop @ {ts}', 'content': content},
                  timeout=15,
              )
              print(f'Ledger write: {ts}_loop.json')
          except Exception as e:
              print(f'Warning: ledger write failed: {e}')
          "

      # ── 19. Reconciler ─────────────────────────────────────────
      - name: "agent: reconciler (agents/runtime/reconciler.py)"
        id: agent_reconciler_agents_runtime_reconciler_py
        continue-on-error: true
        env:
          ABLY_KEY: ${{ secrets.ABLY_KEY }}
        run: python agents/runtime/reconciler.py

      # ── 20. Self-Repair Daemon ──────────────────────────────────
      - name: "agent: self-repair (agents/repair/self_repair.py)"
        id: agent_self_repair_agents_repair_self_repair_p
        continue-on-error: true
        env:
          ABLY_KEY: ${{ secrets.ABLY_KEY }}
        run: python agents/repair/self_repair.py

      # ── 21. Web Sensory Loop ────────────────────────────────────
      - name: "agent: web sense (agents/sensory/web_sense.py)"
        id: agent_web_sense_agents_sensory_web_sense_py
        continue-on-error: true
        env:
          ABLY_KEY: ${{ secrets.ABLY_KEY }}
        run: python agents/sensory/web_sense.py

      # ── 22. Airtable Registry ───────────────────────────────────
      - name: "agent: airtable registry (agents/runtime/airtable_registry.py)"
        id: agent_airtable_registry_agents_runtime_airtab
        continue-on-error: true
        env:
          AIRTABLE_API_KEY: ${{ secrets.AIRTABLE_API_KEY }}
          AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
          ABLY_KEY: ${{ secrets.ABLY_KEY }}
        run: python agents/runtime/airtable_registry.py

      # ── Commit all changes from agents ──────────────────────────
      - name: Commit any changes produced by agents
        run: |
          git config user.name "evez-unified-agent[bot]"
          git config user.email "unified@evez.bot"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "unified daily run @ $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi

      - name: Truth gate — fail if any suppressed stage failed
        if: always()
        env:
          agent_autonomous_cycle_agents_cycle_py: ${{ steps.agent_autonomous_cycle_agents_cycle_py.outcome }}
          agent_synapse_audit_agents_synapse_audit_py: ${{ steps.agent_synapse_audit_agents_synapse_audit_py.outcome }}
          agent_immortal_watchdog_agents_immortal_watch: ${{ steps.agent_immortal_watchdog_agents_immortal_watch.outcome }}
          agent_fix_agent_agents_fix_agent_py: ${{ steps.agent_fix_agent_agents_fix_agent_py.outcome }}
          agent_cockpit_bridge_agents_runtime_cockpit_b: ${{ steps.agent_cockpit_bridge_agents_runtime_cockpit_b.outcome }}
          agent_cognition_synthesizer_agents_cognition_: ${{ steps.agent_cognition_synthesizer_agents_cognition_.outcome }}
          agent_consciousness_observer_agents_conscious: ${{ steps.agent_consciousness_observer_agents_conscious.outcome }}
          agent_consciousness_self_model_agents_conscio: ${{ steps.agent_consciousness_self_model_agents_conscio.outcome }}
          agent_consciousness_journal_agents_consciousn: ${{ steps.agent_consciousness_journal_agents_consciousn.outcome }}
          agent_evolution_self_evolve_agents_evolution_: ${{ steps.agent_evolution_self_evolve_agents_evolution_.outcome }}
          agent_evolution_visual_tracker_agents_evoluti: ${{ steps.agent_evolution_visual_tracker_agents_evoluti.outcome }}
          agent_github_sense_agents_sensory_github_sens: ${{ steps.agent_github_sense_agents_sensory_github_sens.outcome }}
          agent_hypothesis_engine_agents_cognition_hypo: ${{ steps.agent_hypothesis_engine_agents_cognition_hypo.outcome }}
          agent_identity_keeper_agents_consciousness_id: ${{ steps.agent_identity_keeper_agents_consciousness_id.outcome }}
          agent_intelligence_core_agents_intelligence_m: ${{ steps.agent_intelligence_core_agents_intelligence_m.outcome }}
          agent_learn_agent_agents_learn_agent_py: ${{ steps.agent_learn_agent_agents_learn_agent_py.outcome }}
          agent_memory_consolidator_agents_memory_conso: ${{ steps.agent_memory_consolidator_agents_memory_conso.outcome }}
          agent_reasoning_gather_problems: ${{ steps.agent_reasoning_gather_problems.outcome }}
          agent_reasoning_engine_agents_reasoning_engin: ${{ steps.agent_reasoning_engine_agents_reasoning_engin.outcome }}
          agent_reasoning_protocol_agents_reasoning_pro: ${{ steps.agent_reasoning_protocol_agents_reasoning_pro.outcome }}
          agent_reasoning_meta_learner_agents_reasoning: ${{ steps.agent_reasoning_meta_learner_agents_reasoning.outcome }}
          agent_reasoning_innovator_agents_reasoning_in: ${{ steps.agent_reasoning_innovator_agents_reasoning_in.outcome }}
          agent_reasoning_write_ledger: ${{ steps.agent_reasoning_write_ledger.outcome }}
          agent_reconciler_agents_runtime_reconciler_py: ${{ steps.agent_reconciler_agents_runtime_reconciler_py.outcome }}
          agent_self_repair_agents_repair_self_repair_p: ${{ steps.agent_self_repair_agents_repair_self_repair_p.outcome }}
          agent_web_sense_agents_sensory_web_sense_py: ${{ steps.agent_web_sense_agents_sensory_web_sense_py.outcome }}
          agent_airtable_registry_agents_runtime_airtab: ${{ steps.agent_airtable_registry_agents_runtime_airtab.outcome }}
        run: |
          outcomes="${agent_autonomous_cycle_agents_cycle_py},${agent_synapse_audit_agents_synapse_audit_py},${agent_immortal_watchdog_agents_immortal_watch},${agent_fix_agent_agents_fix_agent_py},${agent_cockpit_bridge_agents_runtime_cockpit_b},${agent_cognition_synthesizer_agents_cognition_},${agent_consciousness_observer_agents_conscious},${agent_consciousness_self_model_agents_conscio},${agent_consciousness_journal_agents_consciousn},${agent_evolution_self_evolve_agents_evolution_},${agent_evolution_visual_tracker_agents_evoluti},${agent_github_sense_agents_sensory_github_sens},${agent_hypothesis_engine_agents_cognition_hypo},${agent_identity_keeper_agents_consciousness_id},${agent_intelligence_core_agents_intelligence_m},${agent_learn_agent_agents_learn_agent_py},${agent_memory_consolidator_agents_memory_conso},${agent_reasoning_gather_problems},${agent_reasoning_engine_agents_reasoning_engin},${agent_reasoning_protocol_agents_reasoning_pro},${agent_reasoning_meta_learner_agents_reasoning},${agent_reasoning_innovator_agents_reasoning_in},${agent_reasoning_write_ledger},${agent_reconciler_agents_runtime_reconciler_py},${agent_self_repair_agents_repair_self_repair_p},${agent_web_sense_agents_sensory_web_sense_py},${agent_airtable_registry_agents_runtime_airtab}"
          echo "stage outcomes: $outcomes"
          if echo "$outcomes" | grep -Eq '(^|,)(failure|cancelled)(,|$)'; then
            echo "One or more agent stages failed; refusing to report a green run."
            exit 1
          fi
          echo "All continue-on-error stages completed without failure or cancellation."
